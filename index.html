  .cta { display:block; text-align:center; background:var(--accent); color:var(--accent-ink); text-decoration:none; font-weight:600; font-size:18px; padding:14px; border-radius:14px; }
  .small { color:var(--muted); font-size:14px; text-align:center; margin:8px 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin:14px 0; }
  h2 { font-size:19px; margin:0 0 8px; }
  ol { margin:0; padding-left:22px; } li { margin:6px 0; }
  .note { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:10px 14px; font-size:15px; margin-top:10px; }
  footer { color:var(--muted); font-size:14px; margin-top:28px; }
  a { color:var(--accent); }
</style>
</head>

const sel = document.getElementById('lang');
function apply(lang) {
  const t = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
  sel.value = lang;
}
let start = (navigator.language || 'en').slice(0, 2);
try { start = localStorage.getItem('lang') || start; } catch (e) {}
apply(T[start] ? start : 'en');
sel.addEventListener('change', () => { apply(sel.value); try { localStorage.setItem('lang', sel.value); } catch (e) {} });
